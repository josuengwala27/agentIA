services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: agent_formation_db
    environment:
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agent
      POSTGRES_DB: agent_formation
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent -d agent_formation"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: ./backend
    container_name: agent_formation_api
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://agent:agent@postgres:5432/agent_formation
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      CORS_ORIGINS: http://localhost:3000
    ports:
      - "8000:8000"
    volumes:
      - ./backend/uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  postgres_data:
