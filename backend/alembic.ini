[alembic]
script_location = alembic

# La valeur réelle de la DB URL est injectée dans `alembic/env.py` via les settings.
sqlalchemy.url = postgresql+psycopg://agent:agent@localhost:5433/agent_formation

[loggers]
keys = root,sqlalchemy,alembic
handlers =
qualname = 

[handlers]
keys = console
handlers = console

[formatters]
keys = generic
formatter = generic

[logger_root]
level = INFO
handlers = console

[logger_sqlalchemy]
level = WARN
handlers = console

[logger_alembic]
level = INFO
handlers = console

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

